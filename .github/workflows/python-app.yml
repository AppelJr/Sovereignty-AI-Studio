name: Python application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          python -m pip install numpy
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            python -m pip install -e .
          fi

      - name: Lint with flake8
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t python_files < <(
            find . \
              -type f \
              -name "*.py" \
              -not -path "./.git/*" \
              -not -path "./.venv/*" \
              -not -path "./venv/*"
          )

          if [ "${#python_files[@]}" -eq 0 ]; then
            echo "No Python files found; skipping lint."
            exit 0
          fi

          echo "Linting ${#python_files[@]} Python file(s)"

          # Blocking checks: syntax errors and undefined names.
          flake8 "${python_files[@]}" \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          # Style warnings are reported but do not fail the build.
          flake8 "${python_files[@]}" \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      - name: Test with pytest
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t test_files < <(
            find . \
              -type f \
              \( \
                -name "test_*.py" \
                -o \
                -name "*_test.py" \
              \) \
              -not -path "./.git/*" \
              -not -path "./.venv/*" \
              -not -path "./venv/*"
          )

          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No pytest test files found; skipping tests."
            exit 0
          fi

          pytest -q

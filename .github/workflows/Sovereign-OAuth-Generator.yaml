# =========================================================
# SOVEREIGN OAUTH GENERATOR - PRODUCTION ONLY
# =========================================================
# Strict isolation: OAuth key generation only.
# No tests, no avatar, no third-party actions, no || true.
# Native git checkout. Fail-closed. Python 3.14 ready.
# =========================================================

name: Sovereign-OAuth-Generator

on:
  push:
    branches: [ "main", "Collaboration", "Grok", "grok-oauth-real-run", "ara-hardened" ]
    paths:
      - ".github/workflows/Sovereign-OAuth-Generator.yaml"
      - "scripts/oauth_local_generator.py"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: sovereign-oauth-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend:./services:./core:./scripts
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  oauth-generator:
    name: Production OAuth Generator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit (native git only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          echo "Checked out $(git rev-parse --short HEAD)"

      - name: Verify Python runtime and install cryptography
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -c "import sys; print(sys.version)"
          python3 -c "import sys; assert sys.version_info >= (3, 10), f'Python too old: {sys.version}'"
          python3 -m pip install --upgrade pip
          python3 -m pip install cryptography

      - name: Run production OAuth local generator (dry-run)
        run: |
          set -Eeuo pipefail
          if [[ ! -f scripts/oauth_local_generator.py ]]; then
            echo "ERROR: scripts/oauth_local_generator.py not found"
            ls -la scripts/ || true
            exit 1
          fi
          # Production execution - no tests, no avatar, real Ed25519 path
          python3 scripts/oauth_local_generator.py --dry-run
          echo "OAuth generator completed successfully"

      - name: Confirm no avatar interference
        run: |
          set -Eeuo pipefail
          # Hard fail if any avatar companion residue is in the OAuth path
          if find . -name '*avatar*companion*' -o -name 'Avatar_Companion*' 2>/dev/null | grep -q .; then
            echo "ERROR: Avatar companion artifacts detected in OAuth workspace - isolation violated"
            find . -name '*avatar*companion*' -o -name 'Avatar_Companion*' 2>/dev/null
            exit 1
          fi
          echo "Avatar isolation confirmed clean"

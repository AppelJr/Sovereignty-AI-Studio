name: Dependency Health

on:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, Grok/Ara, copilot/main, Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, Grok/Ara, copilot/main, Collaboration, duckAI, devassist420]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dep-health-${{ github.ref }} # one run per ref; do not cancel
  cancel-in-progress: false

jobs:
  python-audit:
    name: Python — CVE audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pip-audit
        run: python3 -m pip install --upgrade pip pip-audit
      - name: Run pip-audit
        run: |
          set -Eeuo pipefail
          if [[ -f requirements.txt ]]; then
            python3 -m pip_audit -r requirements.txt
          else
            echo "No requirements.txt present — audit skipped"
          fi

  python-outdated:
    name: Python — requirements validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate requirements syntax
        run: |
          set -Eeuo pipefail
          if [[ -f requirements.txt ]]; then
            python3 -m pip install -r requirements.txt
          else
            echo "No requirements.txt present — validation skipped"
          fi

  node-audit:
    name: Node.js — CVE audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Refresh lockfile and run npm audit
        working-directory: node-bridge
        run: |
          set -Eeuo pipefail
          if [[ -f package.json ]]; then
            npm install --package-lock
            npm audit --audit-level=moderate
          else
            echo "No package.json in node-bridge — audit skipped"
          fi

  requirements-lint:
    name: Lint requirements files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate requirements files
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib
          for name in ('requirements.txt', '.github/workflows/Requirements.txt'):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if '\t' in line:
                      raise SystemExit(f'{name}:{number}: tab character is not allowed')
          print('requirements files are structurally valid')
          PY
